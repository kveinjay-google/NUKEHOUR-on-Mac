name: Public source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher-and-public-clean:
    name: Launcher and PublicClean source tests
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify public macOS source
        run: |
          python3 -m unittest \
            packaging.tests.test_background_network_launcher \
            packaging.tests.test_macos_launcher_layout \
            packaging.tests.test_macos_public_clean_launcher \
            packaging.tests.test_launcher_language \
            -q
